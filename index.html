<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geschenkkorb konfigurieren</title>
<meta name="description" content="PLATZHALTER_SEITENBESCHREIBUNG: Stellen Sie sich Ihren Geschenkkorb individuell zusammen.">
<!-- PLATZHALTER_FAVICON: hier z. B. <link rel="icon" href="bilder/favicon.png"> einfügen -->
<style>
/* =====================================================================
   DESIGN
   Farben und Schriften sind unten als Variablen hinterlegt und lassen
   sich zentral anpassen. Es werden bewusst keine Schriften von externen
   Servern geladen (Datenschutz).
   ===================================================================== */
:root{
  --grund:#FCEFE6;          /* Seitenhintergrund, helles Pfirsich */
  --karte:#FFF9F4;          /* Flächen, Karten */
  --text:#3B2A30;           /* Fließtext, dunkles Aubergine-Braun */
  --leise:#6E5A5F;          /* Nebentext */
  --linie:#E8D2C5;          /* feine Rahmen */
  --rose:#A94E60;           /* Hauptfarbe für Knöpfe und Auswahl */
  --rose-dunkel:#8F3F50;
  --butter:#F7E3A6;         /* Hervorhebung */
  --butter-hell:#FBEFC9;
  --salbei:#A9BFA0;         /* Nebenfarbe */
  --salbei-hell:#E4ECDD;
  --warn:#8C2F2F;
  --feldrand:#A08476;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --leiste-h:4.9rem;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--grund);color:var(--text);font-family:var(--sans);font-size:1.0625rem;line-height:1.55}
img,svg{max-width:100%}
a{color:var(--rose-dunkel)}
:focus-visible{outline:3px solid var(--text);outline-offset:3px}
#inhalt:focus,#inhalt h1:focus{outline:none}
#inhalt{overflow-wrap:break-word}
.nur-vorlesen{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--text);color:#fff;padding:.6rem 1rem;z-index:100}
.skip:focus{left:1rem;top:1rem}

/* Kopfbereich */
.kopf{background:var(--karte);border-bottom:1px solid var(--linie)}
.kopf-innen{max-width:70rem;margin:0 auto;padding:.9rem 1.25rem;display:flex;align-items:center}
.marke{display:flex;align-items:center;gap:.75rem;text-decoration:none;color:var(--text);font:600 1.35rem/1.2 var(--serif);overflow-wrap:anywhere}
.marke img{max-height:3.5rem;width:auto;display:block}

/* Schrittleiste */
.schritte{border-bottom:1px solid var(--linie)}
.schritte ul{position:relative;max-width:70rem;margin:0 auto;padding:.75rem 1.25rem .9rem;list-style:none;display:flex;gap:.5rem;overflow-x:auto}
.schritte a{display:inline-flex;align-items:center;gap:.5rem;white-space:nowrap;padding:.5rem .95rem;border:2px solid var(--linie);border-radius:999px;background:var(--karte);color:var(--text);text-decoration:none;font-weight:600;font-size:.98rem}
.schritte a:hover{border-color:var(--rose)}
.schritte a[aria-current="step"]{background:var(--rose);border-color:var(--rose);color:#fff}
.zahl{min-width:1.5rem;padding:0 .4rem;border-radius:999px;background:var(--butter);color:var(--text);font-size:.85rem;text-align:center}

/* Seitenaufbau */
.rahmen{max-width:70rem;margin:0 auto;padding:2rem 1.25rem 3rem;display:grid;grid-template-columns:minmax(0,1fr) 20rem;gap:2.75rem;align-items:start}
body[data-ansicht="recht"] .rahmen,
body[data-ansicht="danke"] .rahmen,
body[data-ansicht="wahl"] .rahmen{grid-template-columns:minmax(0,46rem);justify-content:center}
body[data-ansicht="recht"] .korb,
body[data-ansicht="danke"] .korb,
body[data-ansicht="wahl"] .korb{display:none}

h1{font:600 clamp(1.9rem,4vw,2.7rem)/1.15 var(--serif);letter-spacing:-.01em;margin:0 0 .9rem}
h2{font:600 1.35rem/1.25 var(--serif);margin:2rem 0 .6rem}
.lead{max-width:60ch;margin:0 0 1rem;font-size:1.125rem}
.leise{color:var(--leise)}

/* Knöpfe */
.knopf{display:inline-block;padding:.85rem 1.6rem;border-radius:999px;border:2px solid var(--rose);background:var(--rose);color:#fff;font:600 1.05rem var(--sans);text-align:center;text-decoration:none;cursor:pointer}
.knopf:hover{background:var(--rose-dunkel);border-color:var(--rose-dunkel)}
.knopf.sekundaer{background:transparent;color:var(--rose-dunkel)}
.knopf.sekundaer:hover{background:var(--butter-hell)}
.knopf:disabled{opacity:.5;cursor:not-allowed}

/* Startseite */
.ablauf{list-style:none;margin:1.75rem 0 2rem;padding:0;display:grid;gap:1rem;max-width:40rem;counter-reset:schritt}
.ablauf li{display:grid;grid-template-columns:2.4rem 1fr;gap:.25rem 1rem;counter-increment:schritt}
.ablauf li::before{content:counter(schritt);grid-row:1 / span 2;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--butter);display:grid;place-items:center;font:600 1.15rem var(--serif)}
.ablauf strong{font-weight:700}
.ablauf span{color:var(--leise)}

.wahl-karten{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1.25rem;margin:1.75rem 0 1.5rem;max-width:56rem}
.wahl-karte{display:flex;flex-direction:column;gap:.65rem;padding:1.5rem;background:var(--karte);border:2px solid var(--linie);border-radius:16px}
.wahl-karte h2{margin:0;font-size:1.3rem}
.wahl-karte p{margin:0;color:var(--leise)}
.wahl-karte .preisspanne{display:inline-block;align-self:flex-start;padding:.3rem .8rem;border-radius:999px;background:var(--butter-hell);color:var(--text);font-weight:600;font-size:.92rem}
.blumen{display:flex;gap:.2rem}
.wahl-karte .knopf{margin-top:.4rem;align-self:flex-start}

/* Produktkarten */
.produkte{display:grid;gap:.85rem;margin:1.5rem 0 2rem}
.karte-flaeche{display:grid;grid-template-columns:6.5rem minmax(0,1fr) auto;gap:1rem;align-items:center;padding:.85rem 1rem .85rem .85rem;background:var(--karte);border:2px solid var(--linie);border-radius:14px}
.karte-flaeche.gewaehlt{background:var(--butter-hell);border-color:var(--rose)}
.foto{width:6.5rem;height:6.5rem;border-radius:10px;overflow:hidden;background:var(--butter-hell);display:grid;place-items:center}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto svg{width:62%;height:auto}
.karte-text{min-width:0}
.karte-name{display:block;font:600 1.15rem/1.3 var(--serif);overflow-wrap:anywhere;hyphens:auto}
.karte-beschr{display:block;color:var(--leise);font-size:.98rem;margin-top:.2rem;overflow-wrap:anywhere;hyphens:auto}
.karte-rechts{display:flex;flex-direction:column;align-items:flex-end;gap:.6rem}
.karte-preis{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stepper{display:inline-flex;align-items:center;gap:.55rem;border:2px solid var(--rose);border-radius:999px;padding:.25rem;background:#fff}
.stepper-knopf{width:2rem;height:2rem;border-radius:50%;border:0;background:var(--rose);color:#fff;font:700 1.2rem/1 var(--sans);cursor:pointer;display:grid;place-items:center}
.stepper-knopf:hover:not(:disabled){background:var(--rose-dunkel)}
.stepper-knopf:disabled{background:var(--linie);color:var(--leise);cursor:not-allowed}
.stepper-menge{min-width:1.6rem;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.blaettern{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:space-between;margin-top:1rem}

/* Korb (Seitenleiste) */
.korb{position:sticky;top:1rem;max-height:calc(100vh - 2rem);overflow:auto;background:var(--karte);border:1px solid var(--linie);border-radius:18px;padding:1.1rem 1.1rem 1.25rem}
.korb h2{margin:0 0 .25rem;font-size:1.15rem}
.korb-svg{display:block;width:100%;height:auto;max-width:17rem;margin:0 auto}
.korb-gruppe{transform:scale(var(--s,.66));transform-origin:120px 204px;transition:transform .55s cubic-bezier(.3,1.3,.5,1)}
.pop{opacity:0;transform:translateY(16px);transition:opacity .3s,transform .45s cubic-bezier(.3,1.4,.5,1)}
.slot.an .pop{opacity:1;transform:none}
.korb p{margin:.25rem 0}
.gl{display:block;font-size:.9rem;color:var(--leise)}
.summe strong{font:600 1.7rem/1.2 var(--serif)}
.hinweis-klein{font-size:.95rem;color:var(--leise);margin-top:.6rem!important}
.korb .knopf{display:block;width:100%}
.korb-schalter{display:none}

/* Zusammenfassung */
.ergebnis{display:flex;flex-wrap:wrap;gap:.5rem 3rem;padding:1.1rem 1.4rem;margin:1.25rem 0 1.5rem;background:var(--karte);border:2px solid var(--butter);border-radius:14px}
.ergebnis .gl{margin-bottom:.1rem}
.ergebnis .gross{font:600 2rem/1.15 var(--serif);font-variant-numeric:tabular-nums}
.liste{list-style:none;margin:0 0 1.25rem;padding:0;max-width:40rem}
.liste li{display:flex;justify-content:space-between;gap:1rem;padding:.45rem 0;border-bottom:1px solid var(--linie)}
.liste li > span:first-child{min-width:0;overflow-wrap:anywhere}
.liste .preis{font-variant-numeric:tabular-nums;white-space:nowrap}
.kat-kopf{display:flex;justify-content:space-between;align-items:baseline;max-width:40rem;margin-top:1.25rem;font-weight:700}
.kat-kopf a{font-weight:400}

/* Formular */
.formular{max-width:40rem}
.feld{margin-bottom:1.15rem}
.feld > label{display:block;font-weight:600;margin-bottom:.3rem}
.opt{font-weight:400;color:var(--leise)}
.feld input[type="text"],.feld input[type="email"],.feld input[type="tel"],.feld textarea{width:100%;padding:.7rem .8rem;font:inherit;color:var(--text);background:#fff;border:2px solid var(--feldrand);border-radius:10px}
.feld textarea{resize:vertical;min-height:7rem}
.feld [aria-invalid="true"]{border-color:var(--warn)}
.feld-hinweis{margin:.3rem 0 0;font-size:.95rem;color:var(--leise)}
.fehler{margin:.35rem 0 0;color:var(--warn);font-weight:600}
.zaehler{margin:.25rem 0 0;font-size:.9rem;color:var(--leise);text-align:right}
.check label{display:grid;grid-template-columns:1.5rem 1fr;gap:.75rem;align-items:start;cursor:pointer}
.check input{width:1.4rem;height:1.4rem;margin:.15rem 0 0;accent-color:var(--rose)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.hinweisbox{margin:1.5rem 0;padding:1rem 1.2rem;background:var(--butter-hell);border:2px solid var(--butter);border-radius:12px}
.hinweisbox p{margin:.35rem 0}
.hinweisbox strong{font-weight:700}
.warnbox{margin:1rem 0;padding:.9rem 1.1rem;border:2px solid var(--warn);border-radius:12px;background:#fff;color:var(--warn);font-weight:600}
.testbox{margin:1.5rem 0;padding:1rem 1.2rem;border:2px dashed var(--salbei);border-radius:12px;background:#fff}
.testbox p{margin:.3rem 0}

/* Danke-Seite und Mailvorschau */
details.mail{margin:.75rem 0;border:1px solid var(--linie);border-radius:10px;background:#fff;padding:.6rem 1rem}
details.mail summary{cursor:pointer;font-weight:600}
details.mail dl{margin:.6rem 0;display:grid;grid-template-columns:auto 1fr;gap:.2rem 1rem}
details.mail dt{color:var(--leise)}
details.mail dd{margin:0;min-width:0;overflow-wrap:anywhere}
details.mail pre{white-space:pre-wrap;word-break:break-word;margin:.5rem 0 .25rem;font:.95rem/1.5 var(--sans)}

/* Rechtstexte */
.recht p{max-width:65ch;margin:.3rem 0 .85rem;overflow-wrap:anywhere}
.musterhinweis{max-width:65ch;margin:0 0 1.5rem;padding:.9rem 1.1rem;background:#fff;border:2px dashed var(--salbei);border-radius:12px}

/* Fuß und Hinweis */
.fuss{border-top:1px solid var(--linie);padding:1.5rem 1.25rem;text-align:center;color:var(--leise);font-size:.95rem}
.fuss nav{display:flex;flex-wrap:wrap;gap:.4rem 1.5rem;justify-content:center;margin-bottom:.6rem}
#cookie-hinweis{position:fixed;left:1rem;bottom:1rem;max-width:27rem;z-index:60;background:var(--karte);border:2px solid var(--text);border-radius:14px;padding:1rem 1.1rem}
#cookie-hinweis p{margin:0 0 .75rem;font-size:.98rem}
#cookie-hinweis .aktionen{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
#cookie-hinweis .knopf{padding:.55rem 1.2rem;font-size:1rem}

/* Handy und schmale Fenster */
@media (max-width:56rem){
  .rahmen{grid-template-columns:minmax(0,1fr);padding-top:1.5rem;padding-bottom:calc(var(--leiste-h) + 2rem)}
  .fuss{padding-bottom:calc(var(--leiste-h) + 1.5rem)}
  .korb{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:none;overflow:visible;padding:0;border-width:1px 0 0;border-radius:18px 18px 0 0;z-index:40;box-shadow:0 -4px 16px rgba(59,42,48,.12)}
  .korb-schalter{display:flex;align-items:center;gap:.85rem;width:100%;min-height:var(--leiste-h);padding:.5rem 1.1rem;background:transparent;border:0;font:inherit;color:var(--text);cursor:pointer;text-align:left}
  .ks-bild{flex:none;width:4.7rem;line-height:0;margin:-1.4rem 0 -.3rem}
  .ks-bild .korb-svg{max-width:none;margin:0}
  .ks-text{display:flex;flex-direction:column;flex:1;min-width:0}
  .ks-name{font:600 1.15rem/1.25 var(--serif)}
  .ks-summe{font-weight:700;font-variant-numeric:tabular-nums}
  .ks-aktion{flex:none;color:var(--rose-dunkel);font-weight:600;text-decoration:underline}
  .korb-detail{display:none;max-height:70vh;overflow:auto;padding:0 1.1rem 1.1rem}
  .korb.offen .korb-detail{display:block}
  .korb-svg{max-width:13rem}
  .karte-flaeche{grid-template-columns:5rem minmax(0,1fr);gap:.75rem}
  .foto{width:5rem;height:5rem}
  .karte-rechts{grid-column:1 / -1;flex-direction:row;justify-content:space-between;align-items:center}
  #cookie-hinweis{left:.6rem;right:.6rem;max-width:none;bottom:.6rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body data-ansicht="wahl">
<noscript><p style="padding:1rem">Bitte aktivieren Sie JavaScript, um den Geschenkkorb zu konfigurieren.</p></noscript>
<a class="skip" href="#inhalt">Zum Inhalt springen</a>

<header class="kopf"><div class="kopf-innen" id="kopf"></div></header>
<nav class="schritte" id="schritte" aria-label="Kategorien" hidden><ul></ul></nav>

<div class="rahmen">
  <main id="inhalt" tabindex="-1"></main>
  <aside class="korb leer" id="korb" aria-label="Ihr Geschenkkorb"></aside>
</div>

<footer class="fuss" id="fuss"></footer>

<div id="cookie-hinweis" role="region" aria-label="Hinweis zu Cookies und Datenschutz" hidden>
  <p id="cookie-text"></p>
  <div class="aktionen">
    <button type="button" class="knopf" id="cookie-ok">Verstanden</button>
    <a href="#datenschutz">Zur Datenschutzerklärung</a>
  </div>
</div>
<div class="nur-vorlesen" id="ansage" aria-live="polite"></div>


<!-- =====================================================================
     KONFIGURATION: HIER WIRD ALLES ANGEPASST
     Alle Stellen, die Sie noch ausfüllen müssen, enthalten das Wort
     PLATZHALTER. Mit der Suchfunktion Ihres Editors (Strg+F bzw. Cmd+F)
     nach "PLATZHALTER" finden Sie sie alle.

     BILDER: Legen Sie Fotos und Logos in einen Ordner "bilder" neben
     diese Datei und tragen Sie den Pfad ein, z. B. "bilder/wein-1.jpg".
     Ist ein Pfad leer (""), wird stattdessen ein Platzhalterbild bzw.
     der Firmenname gezeigt.
     ===================================================================== -->
<script>
const KONFIG = {

  /* ---------- FIRMA ---------- */
  firma: {
    name: "Wittl e.K.",
    logo: "img/Logo.jpeg",                                   // PLATZHALTER_FIRMENLOGO, z. B. "bilder/logo.png"
    logoAlt: "PLATZHALTER_FIRMENLOGO_ALTTEXT",  // Beschreibung des Logos für Screenreader
    strasse: "PLATZHALTER_STRASSE_HAUSNUMMER",
    plzOrt: "PLATZHALTER_PLZ_ORT",
    telefon: "PLATZHALTER_TELEFON",
    email: "PLATZHALTER_KONTAKT_EMAIL",
    oeffnungszeiten: "PLATZHALTER_OEFFNUNGSZEITEN"
  },

  /* ---------- TEXTE ---------- */
  texte: {
    seitentitel: "Geschenkkorb konfigurieren",   // PLATZHALTER_SEITENTITEL
    startTitel: "Ihr Geschenkkorb, ganz nach Ihrem Geschmack",   // PLATZHALTER_STARTTITEL
    startText: [                                                  // PLATZHALTER_STARTTEXT
      "Stellen Sie sich in wenigen Schritten einen Geschenkkorb zusammen, der genau zu der Person passt, die Sie beschenken möchten.",
      "Sie können jedes Produkt einzeln auswählen oder sich zu Ihrem Budget einen Zufallsvorschlag erstellen lassen und diesen danach noch anpassen."
    ],
    startSchritte: [                                              // PLATZHALTER_STARTSCHRITTE
      { titel: "Produkte auswählen", text: "Gehen Sie die Kategorien durch und stellen Sie mit Plus und Minus die gewünschte Menge ein. Sie können jederzeit zwischen den Kategorien wechseln." },
      { titel: "Korb und Preis sehen", text: "Der Korb wächst mit Ihrer Auswahl, und Sie sehen jederzeit die Summe der Einzelpreise." },
      { titel: "Absenden und abholen", text: "Wir richten den Korb für Sie her. In der Regel steht er am nächsten Werktag zur Abholung bereit." }
    ],
    // Texte für die Wahl zwischen individueller Konfiguration und Zufallsgenerator (Startseite)
    wahlIndividuellTitel: "Individuell konfigurieren",          // PLATZHALTER_WAHL_INDIVIDUELL_TITEL
    wahlIndividuellText: "Sie stellen jedes Produkt selbst zusammen, Kategorie für Kategorie.",   // PLATZHALTER_WAHL_INDIVIDUELL_TEXT
    wahlIndividuellButton: "Individuell konfigurieren - los geht's!",   // PLATZHALTER_WAHL_INDIVIDUELL_BUTTON
    wahlZufallTitel: "Zufallsgeschenkkorb nach Budget",          // PLATZHALTER_WAHL_ZUFALL_TITEL
    wahlZufallText: "Sie nennen uns Ihr Budget, wir schlagen Ihnen einen passenden Korb vor. Sie können ihn danach noch anpassen.",   // PLATZHALTER_WAHL_ZUFALL_TEXT
    wahlZufallButton: "Zufallsgeschenkkorb nach Budget",         // PLATZHALTER_WAHL_ZUFALL_BUTTON
    // Texte für die Budgetauswahl
    budgetTitel: "Wählen Sie Ihr Budget",                        // PLATZHALTER_BUDGET_TITEL
    budgetText: "Wir stellen Ihnen einen zufälligen Geschenkkorb bis zu diesem Betrag zusammen.",   // PLATZHALTER_BUDGET_TEXT
    // Texte für den Zufallsvorschlag
    zufallTitel: "Ihr Vorschlag",                                // PLATZHALTER_ZUFALL_TITEL
    zufallText: "Das ist unser Vorschlag für Ihr Budget. Im nächsten Schritt können Sie ihn noch verändern.",   // PLATZHALTER_ZUFALL_TEXT
    zufallNeuButton: "Neu mischen",                              // PLATZHALTER_ZUFALL_NEU_BUTTON
    zufallWeiterButton: "Weiter zur individuellen Anpassung",    // PLATZHALTER_ZUFALL_WEITER_BUTTON
    zufallKeinErgebnis: "Für dieses Budget konnten wir leider keinen Korb mit mindestens drei Produkten zusammenstellen. Bitte wählen Sie ein höheres Budget oder stellen Sie Ihren Korb individuell zusammen.",   // PLATZHALTER_ZUFALL_KEIN_ERGEBNIS
    // Hinweistexte im letzten Schritt
    abholHinweis: "Mit dem Absenden wird Ihr Geschenkkorb von unseren Mitarbeiterinnen hergerichtet. In der Regel steht er am nächsten Werktag zur Abholung bereit. Zusätzlich erhalten Sie eine Bestätigung per E-Mail.",   // PLATZHALTER_ABHOLHINWEIS
    alkoholHinweis: "Alkoholische Getränke werden nur nach den Vorgaben des Jugendschutzgesetzes abgegeben (Spirituosen ab 18 Jahren).",   // PLATZHALTER_ALKOHOLHINWEIS
    zahlungsHinweis: "PLATZHALTER_ZAHLUNGSHINWEIS: z. B. Bezahlung bei Abholung im Geschäft.",
    preisHinweis: "Alle Preise in Euro, inklusive gesetzlicher Umsatzsteuer.",   // PLATZHALTER_PREISHINWEIS
    cookieText: "Diese Seite setzt keine Cookies zu Analyse- oder Werbezwecken. Gespeichert wird höchstens, dass Sie diesen Hinweis gesehen haben. Details finden Sie in der Datenschutzerklärung."   // PLATZHALTER_COOKIETEXT
  },

  /* ---------- HÖCHSTPREIS ----------
     Der Geschenkkorb wächst beim individuellen Konfigurieren visuell mit der Summe der
     Einzelpreise; ab diesem Betrag (in Euro) ist der Korb "voll". */
  maxGesamtpreis: 100,                       // PLATZHALTER_MAX_GESAMTPREIS
  // false = Bestellung über dem Höchstpreis ist nicht möglich; true = möglich (Bestellung "auf Anfrage")
  ueberGrenzeErlaubt: false,

  /* ---------- ZUFALLSGESCHENKKORB NACH BUDGET ----------
     "betrag" ist die Obergrenze in Euro; bei "strengUnter: true" gilt sie ausschließlich
     (z. B. "unter 15 €"), sonst einschließlich (z. B. "bis 25 €"). "blumen" bestimmt, wie
     viele Blumen-Symbole bei dieser Stufe angezeigt werden. Wein und Spirituosen werden erst
     ab der zweiten Stufe berücksichtigt (siehe "weinAbStufe" weiter unten). */
  zufallsBudgets: [
    { label: "unter 15 €", betrag: 15, strengUnter: true, blumen: 1 },   // PLATZHALTER_BUDGET_1_LABEL
    { label: "bis 25 €",   betrag: 25, blumen: 2 },                       // PLATZHALTER_BUDGET_2_LABEL
    { label: "bis 45 €",   betrag: 45, blumen: 3 },                       // PLATZHALTER_BUDGET_3_LABEL
    { label: "bis 65 €",   betrag: 65, blumen: 4 }                        // PLATZHALTER_BUDGET_4_LABEL
  ],

<script>

/* Kleine Hilfsfunktion zum sicheren Erzeugen von HTML-Elementen */
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if(props){
    for(const [k, v] of Object.entries(props)){
      if(v === false || v == null) continue;
      if(k === 'class') el.className = v;
      else if(k === 'html') el.innerHTML = v;   // nur für eigene, feste SVG-Grafiken
      else if(k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if(v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);
    }
  }
  kids.flat().forEach(kid => { if(kid != null && kid !== false) el.append(kid); });
  return el;
}

const EUR = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
const eur = cent => EUR.format(cent / 100);

  tee: '<rect x="-12" y="-38" width="24" height="38" rx="3" fill="#A9BFA0"/><rect x="-13.5" y="-45" width="27" height="8" rx="2.5" fill="#8CA582"/><circle cx="0" cy="-19" r="7" fill="#FFF9F4"/>',

    const x = 40 + (ki + 0.5) * (160 / n);

/* ---------- Zustand ---------- */
// auswahl: { produktId: menge }
const zustand = { auswahl: {}, formular: {}, bestellung: null, zufall: null, letzteRoute: '#start' };
let aktuelleRoute = '#start';

function mengeVon(id){ return zustand.auswahl[id] || 0; }
function mengeSetzen(id, menge){
  menge = Math.max(0, Math.min(MAX_MENGE, menge));
  if(menge <= 0) delete zustand.auswahl[id]; else zustand.auswahl[id] = menge;
}

function berechne(){
  let cent = 0, anzahl = 0;
  const proKat = K.map(() => []);
  K.forEach((k, ki) => k.produkte.forEach(p => {
    const menge = mengeVon(p.id);
    if(menge > 0){ cent += Math.round(p.preis * 100) * menge; anzahl += menge; proKat[ki].push({ p, menge }); }
  }));
  return { cent, anzahl, proKat };
}
const GRENZE_CENT = () => Math.round(KONFIG.maxGesamtpreis * 100);
function ueberGrenzeGesperrt(b){ return b.cent > GRENZE_CENT() && !KONFIG.ueberGrenzeErlaubt; }
function korbHinweis(b){
  if(b.anzahl === 0) return 'Ihr Korb ist noch leer.';

/* ---------- Zufallsgeschenkkorb nach Budget ---------- */
const BLUME_SVG = '<svg viewBox="-11 -11 22 22" width="18" height="18" aria-hidden="true" focusable="false"><g fill="#A94E60"><circle cx="0" cy="-5.4" r="3.6"/><circle cx="4.7" cy="-1.6" r="3.6"/><circle cx="2.9" cy="4.5" r="3.6"/><circle cx="-2.9" cy="4.5" r="3.6"/><circle cx="-4.7" cy="-1.6" r="3.6"/></g><circle r="2.6" fill="#F7E3A6"/></svg>';

function budgetCent(tier){ return Math.round(tier.betrag * 100) - (tier.strengUnter ? 1 : 0); }

function mischen(liste){
  const a = liste.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/** Stellt zufällig einen Geschenkkorb bis zu einer Preisgrenze zusammen (ohne doppelte Produkte).
    Probiert mehrere zufällige Reihenfolgen durch und behält die Zusammenstellung, die das Budget
    am besten ausschöpft, ohne es zu überschreiten. Gibt null zurück, wenn keine Zusammenstellung
    mit der Mindestanzahl an Produkten möglich ist. */
function zufallskorbErzeugen(tierIndex){
  const tier = KONFIG.zufallsBudgets[tierIndex];
  const grenze = budgetCent(tier);
  const weinErlaubt = tierIndex >= KONFIG.zufallWeinAbStufe;
  const kandidaten = [];
  K.forEach((k, ki) => {
    if(k.icon === 'wein' && !weinErlaubt) return;
    k.produkte.forEach(p => kandidaten.push({ p, ki, preis: Math.round(p.preis * 100) }));
  });

  let bester = null;
  for(let versuch = 0; versuch < 300; versuch++){
    let summe = 0;
    const gewaehlt = [];
    for(const kand of mischen(kandidaten)){
      if(gewaehlt.length >= KONFIG.zufallMaxProdukte) break;
      if(summe + kand.preis <= grenze){ gewaehlt.push(kand); summe += kand.preis; }
    }
    if(gewaehlt.length >= KONFIG.zufallMinProdukte && (!bester || summe > bester.summe)){
      bester = { summe, items: gewaehlt };
      if(bester.summe === grenze) break;
    }
  }
  return bester;
}

/* Prüfung und Versand */
const MAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function pruefe(f){
  const e = {};
  if(!f.name || f.name.trim().length < 2) e.name = 'Bitte geben Sie Ihren Namen ein.';
  if(!f.email || !MAIL_RE.test(f.email.trim())) e.email = 'Bitte geben Sie eine gültige E-Mail-Adresse ein, z. B. name@beispiel.de.';
  if(f.telefon && !/^[0-9+()\/\s.-]{5,}$/.test(f.telefon.trim())) e.telefon = 'Bitte geben Sie die Telefonnummer mit Ziffern ein, z. B. 0123 456789.';
  if((f.nachricht || '').length > 500) e.nachricht = 'Die Nachricht darf höchstens 500 Zeichen lang sein.';
  if(!f.datenschutz) e.datenschutz = 'Bitte bestätigen Sie, dass Sie die Datenschutzerklärung gelesen haben.';
  return e;
}
function zeigeFehler(errs){
  let erstes = null;
  ['name', 'email', 'telefon', 'nachricht', 'datenschutz'].forEach(id => {
    const p = $('#f-' + id + '-fehler'), inp = $('#f-' + id);
    if(errs[id]){ p.textContent = errs[id]; p.hidden = false; inp.setAttribute('aria-invalid', 'true'); if(!erstes) erstes = inp; }
    else { p.textContent = ''; p.hidden = true; inp.removeAttribute('aria-invalid'); }
  });
  if(erstes) erstes.focus();
  return !!erstes;
}

    '  Name: ' + f.name.trim(),
    '  Kundennummer: ' + ((f.kundennummer || '').trim() || 'nicht angegeben'),
    '  E-Mail: ' + f.email.trim(),
    '  Telefon: ' + ((f.telefon || '').trim() || 'nicht angegeben'),
    '',
    'Bitte zusammenstellen:',
    ...positionen,
    '',
    'Nachricht der Kundin/des Kunden:',
    nachricht || '(keine)',
    '',
    'Zum Antworten einfach auf „Antworten“ klicken, die Adresse der Kundin/des Kunden ist als Antwortadresse hinterlegt.'
  ].join('\n');

  return {
    kunde: { an: f.email.trim(), betreff: 'Ihre Geschenkkorb-Bestellung ' + nr + ' bei ' + F.name, text: kundeText },
    mitarbeiter: { an: KONFIG.mail.mitarbeiterAdresse, antwortAn: f.email.trim(), betreff: 'Neue Bestellung ' + nr + ' (' + b.anzahl + ' Artikel) von ' + f.name.trim(), text: mitarbeiterText }
  };
}

async function absenden(ev){
  ev.preventDefault();
  const f = zustand.formular;
  if(zeigeFehler(pruefe(f))) return;
  if(f.website) return;                                  // Spam-Falle (Feld bleibt bei Menschen leer)
  const b = berechne();
  if(b.anzahl === 0 || ueberGrenzeGesperrt(b)) return;

  const knopf = $('#senden'), fehlerBox = $('#sendefehler');
  fehlerBox.hidden = true;
  knopf.disabled = true; knopf.textContent = 'Wird gesendet …';

  const nr = bestellnummer();
  const mails = baueMails(nr, b, f);
  try{
    if(KONFIG.mail.endpunkt){
      /* Der Server sollte diese Daten erneut prüfen (Preise, Größe, E-Mail-Adresse) und
         die Empfängeradresse des Geschäfts selbst festlegen. */
      const res = await fetch(KONFIG.mail.endpunkt, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          bestellnummer: nr,
          endpreisEuro: b.cent / 100,
          positionen: K.flatMap((k, ki) => b.proKat[ki].map(({ p, menge }) => ({ kategorie: k.name, id: p.id, name: p.name, preisEuro: p.preis, menge }))),
          kunde: { name: f.name.trim(), kundennummer: (f.kundennummer || '').trim(), email: f.email.trim(), telefon: (f.telefon || '').trim(), nachricht: (f.nachricht || '').trim() },
          mails
        })
      });
      if(!res.ok) throw new Error('HTTP ' + res.status);
    }
    zustand.bestellung = { nr, mails, test: !KONFIG.mail.endpunkt, name: f.name.trim(), email: f.email.trim() };
    zustand.auswahl = {};
    zustand.formular = {};
    location.hash = '#danke';
  }catch(err){
    fehlerBox.textContent = 'Ihre Bestellung konnte nicht gesendet werden. Bitte versuchen Sie es noch einmal oder rufen Sie uns an: ' + F.telefon + '.';
    fehlerBox.hidden = false;
    knopf.disabled = false; knopf.textContent = 'Geschenkkorb absenden';
  }
}

function mailVorschau(titel, m){
  return h('details', { class: 'mail' },
    h('summary', null, titel),
    h('dl', null,
      h('dt', null, 'An'), h('dd', null, m.an),
      m.antwortAn ? [h('dt', null, 'Antwort an'), h('dd', null, m.antwortAn)] : null,
      h('dt', null, 'Betreff'), h('dd', null, m.betreff)),
    h('pre', null, m.text));
}

function viewDanke(){
  const o = zustand.bestellung;
  const sec = h('section', null,
    h('h1', { tabindex: '-1' }, 'Vielen Dank, ' + o.name + '!'),
    h('p', { class: 'lead' }, 'Ihre Bestellung ' + o.nr + ' ist bei uns eingegangen. Unsere Mitarbeiterinnen richten Ihren Geschenkkorb jetzt her. In der Regel steht er am nächsten Werktag zur Abholung bereit.'),
    h('p', null, 'Eine Bestätigung erhalten Sie zusätzlich per E-Mail an ' + o.email + '.'));
  if(o.test){
    sec.append(h('div', { class: 'testbox' },
      h('p', null, h('strong', null, 'Testmodus: '), 'Es wurde keine E-Mail verschickt. So würden die beiden E-Mails aussehen:'),
      mailVorschau('E-Mail an die Kundin/den Kunden', o.mails.kunde),
      mailVorschau('E-Mail an die Mitarbeiterin/den Mitarbeiter', o.mails.mitarbeiter)));
  }
  sec.append(h('p', null, h('a', { class: 'knopf primaer', href: '#start', onclick: () => { zustand.bestellung = null; } }, 'Neuen Geschenkkorb zusammenstellen')));
  return sec;
}

function viewRecht(key){
  const r = RECHTSTEXTE[key];
  return h('section', { class: 'recht' },
    h('h1', { tabindex: '-1' }, r.titel),
    KONFIG.musterhinweis ? h('p', { class: 'musterhinweis' }, KONFIG.musterhinweis) : null,
    r.abschnitte.map(a => [h('h2', null, a.h), a.p.map(t => h('p', null, t))]),
    h('p', null, h('a', { class: 'knopf sekundaer', href: zustand.letzteRoute }, 'Zurück zum Geschenkkorb')));
}

/* ---------- Routing ---------- */
const ROUTEN = ['#start', '#budget', '#zufall-ergebnis', ...K.map((k, i) => '#kategorie-' + (i + 1)), '#abschluss', '#danke', '#impressum', '#datenschutz', '#disclaimer'];

function route(erstesMal){
  let r = location.hash || '#start';
  if(!ROUTEN.includes(r)) r = '#start';
  if(r === '#danke' && !zustand.bestellung) r = '#start';
  aktuelleRoute = r;

  let ansicht, view;
  if(r === '#start'){ ansicht = 'wahl'; view = viewStart(); }
  else if(r === '#budget'){ ansicht = 'wahl'; view = viewBudget(); }
  else if(r === '#zufall-ergebnis'){
    if(!zustand.zufall){ r = '#budget'; ansicht = 'wahl'; view = viewBudget(); }
    else { ansicht = 'wahl'; view = viewZufallErgebnis(); }
  }
  else if(r.startsWith('#kategorie-')){ ansicht = 'kategorie'; view = viewKategorie(parseInt(r.slice(11), 10) - 1); }
  else if(r === '#abschluss'){ ansicht = 'abschluss'; view = viewAbschluss(); }
  else if(r === '#danke'){ ansicht = 'danke'; view = viewDanke(); }
  else { ansicht = 'recht'; view = viewRecht(r.slice(1)); }
  if(ansicht !== 'recht') zustand.letzteRoute = (r === '#danke') ? '#start' : r;

  document.body.dataset.ansicht = ansicht;
  const main = $('#inhalt');
  main.replaceChildren(view);
  renderSchritte();
  aktualisiereKorb(false);
  $('#korb').classList.remove('offen');
  $('#korb .korb-schalter').setAttribute('aria-expanded', 'false');
  $('#ksAktion').textContent = 'Korb ansehen';

  const titel = view.querySelector('h1');
  document.title = (r === '#start' ? T.seitentitel : titel.textContent) + ' | ' + F.name;

  if(!erstesMal){
    window.scrollTo(0, 0);
    titel.focus({ preventScroll: true });
    const akt = $('#schritte [aria-current]');
    if(akt && !$('#schritte').hidden) akt.scrollIntoView({ inline: 'center', block: 'nearest' });
  }
}

/* ---------- Produkte aus produkte.json laden (falls vorhanden) ---------- */
async function ladeProdukte(){
  try{
    const ac = new AbortController();
    const timer = setTimeout(() => ac.abort(), 4000);
    const res = await fetch('produkte.json', { cache: 'no-cache', signal: ac.signal });
    clearTimeout(timer);
    if(!res.ok) return;
    const daten = await res.json();
    const kat = daten && daten.kategorien;
    if(!kat || typeof kat !== 'object') return;
    K.forEach(k => {
      const liste = kat[k.icon];
      if(!Array.isArray(liste)) return;
      k.produkte = liste
        .filter(p => p && typeof p.name === 'string' && p.name.trim() && p.id)
        .map(p => ({
          id: String(p.id),
          name: String(p.name),
          beschreibung: String(p.beschreibung || ''),
          preis: Math.max(0, Number(p.preis) || 0),
          foto: /^bilder\/[A-Za-z0-9._-]+$/.test(String(p.foto || '')) ? String(p.foto) : ''
        }));
    });
  }catch(e){ /* Datei fehlt oder ist nicht lesbar: Beispielprodukte aus der Konfiguration verwenden */ }
}

/* ---------- Aufbau der festen Bereiche ---------- */
function init(){
  $('#kopf').append(h('a', { class: 'marke', href: '#start' },
    F.logo ? h('img', { src: F.logo, alt: F.logoAlt }) : null,
    F.logo ? null : F.name));

  $('#fuss').append(
    h('nav', { 'aria-label': 'Rechtliches' },
      h('a', { href: '#impressum' }, 'Impressum'),
      h('a', { href: '#datenschutz' }, 'Datenschutz'),
      h('a', { href: '#disclaimer' }, 'Disclaimer und Hinweise')),
    h('p', null, '© ' + new Date().getFullYear() + ' ' + F.name));

  $('#cookie-text').textContent = T.cookieText;
  let gesehen = false;
  try{ gesehen = localStorage.getItem('gk-hinweis') === '1'; }catch(e){}
  if(!gesehen){
    $('#cookie-hinweis').hidden = false;
    $('#cookie-ok').addEventListener('click', () => {
      $('#cookie-hinweis').hidden = true;
      try{ localStorage.setItem('gk-hinweis', '1'); }catch(e){}
    });
  }

  document.querySelector('.skip').addEventListener('click', e => { e.preventDefault(); $('#inhalt').focus(); });

  baueKorb();
  route(true);
  window.addEventListener('hashchange', () => route(false));
}
ladeProdukte().then(init);
})();
</script>
